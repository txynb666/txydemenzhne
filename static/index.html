<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>门诊预约与分诊助手</title>
<link rel="stylesheet" href="/chat.css?v=20261105-2">
</head>
<body>
<main class="app-shell">

<header>
  <div class="header-main">
    <div class="logo" aria-hidden="true">✚</div>
    <div class="header-copy">
      <span class="eyebrow">企业健康服务 · CARE DESK</span>
      <h1>门诊预约与分诊助手</h1>
      <p>制度问答 · 分诊推荐仅供参考，以分诊台医生判断为准</p>
    </div>
    <span class="service-badge">员工服务</span>
  </div>
  <div class="conversation-bar">
    <span class="conversation-title">咨询对话</span>
    <span class="service-topics">制度咨询<span aria-hidden="true">/</span>预约分诊<span aria-hidden="true">/</span>报销指引</span>
  </div>
</header>

<div id="chat" role="log" aria-label="对话消息"></div>
<div id="status" role="status" aria-live="polite"></div>
<div id="err" role="alert"></div>

<footer>
  <div class="input-shell">
    <label for="input">向门诊助手提问</label>
    <div class="input-row">
      <textarea aria-label="输入咨询问题" id="input" placeholder="请输入问题，例如：门诊报销比例是多少？" rows="1"></textarea>
      <button id="send">发送<span aria-hidden="true">↗</span></button>
    </div>
  </div>
  <div class="composer-hint"><span>制度咨询 · 预约协作 · 报销指引</span><span>Enter 发送 · Shift + Enter 换行</span></div>
</footer>
</main>

<script src="/stream.js"></script>
<script>
/* ================= 状态管理 ================= */
let sessionId = localStorage.getItem("clinic_session") || "";  // 会话续接
let busy = false;      // 是否正在生成（期间禁用输入）
let typingQueue = [];  // 打字机待渲染队列
let typingTimer = null;
let currentBubble = null, currentText = "", cursorEl = null;

const chatEl = document.getElementById("chat");
const statusEl = document.getElementById("status");
const errEl = document.getElementById("err");
const inputEl = document.getElementById("input");
const sendEl = document.getElementById("send");

/* ================= 工具函数 ================= */
function scrollBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }

/* 追加一条消息气泡，返回气泡内容元素 */
function addMsg(role){
  const row = document.createElement("div");
  row.className = "row " + (role === "user" ? "user" : "bot");
  const b = document.createElement("div");
  b.className = "bubble";
  row.appendChild(b);
  chatEl.appendChild(row);
  scrollBottom();
  return b;
}

/* 打字机效果：delta 先入队，定时器每 30ms 弹出 2 字符渲染 */
function enqueueTyping(text){
  typingQueue.push(text);
  if (typingTimer) return;
  typingTimer = setInterval(() => {
    if (!typingQueue.length){ clearInterval(typingTimer); typingTimer = null; return; }
    let take = 2;                              // 每帧最多渲染 2 个字符，营造打字节奏
    while (take > 0 && typingQueue.length){
      const piece = typingQueue[0].slice(0, take);
      typingQueue[0] = typingQueue[0].slice(take);
      if (!typingQueue[0]) typingQueue.shift();
      currentText += piece;
      take -= piece.length;
    }
    currentBubble.textContent = currentText;
    currentBubble.appendChild(cursorEl);
    scrollBottom();
  }, 30);
}

/* 渲染引用来源卡片 */
function renderSources(bubble, sources){
  const card = document.createElement("div");
  card.className = "src-card";
  card.innerHTML = '<div class="t">📚 引用制度来源</div>';
  sources.forEach(s => {
    const d = document.createElement("div");
    d.className = "src-item";
    const b = document.createElement("b"); b.textContent = "《" + s.doc + "》 ";
    d.appendChild(b);
    d.appendChild(document.createTextNode(s.snippet));
    card.appendChild(d);
  });
  bubble.appendChild(card);
  scrollBottom();
}

/* 渲染工具调用轨迹（让"会自己调工具"这件事对用户可见） */
const TOOL_LABEL = {
  search_policy:"检索制度", list_available_slots:"查询号源",
  check_slot_availability:"确认号源", check_reimbursement_eligibility:"校验报销资格",
  create_appointment:"创建预约", create_reimbursement_draft:"生成报销草稿",
  get_my_appointments:"查我的预约", get_my_reimbursements:"查我的报销"
};
function renderTools(bubble, log){
  if (!log || !log.length) return;
  const box = document.createElement("div");
  box.className = "tools";
  box.innerHTML = '<div class="t">🛠 执行过程</div>';
  log.forEach(x => {
    const chip = document.createElement("span");
    chip.className = "tool-chip" + (x.ok ? "" : " bad");
    chip.textContent = (x.ok ? "✓ " : "✗ ") + (TOOL_LABEL[x.name] || x.name);
    if (!x.ok && x.message) chip.title = x.message;
    box.appendChild(chip);
  });
  bubble.appendChild(box);
}

function showError(msg){
  errEl.textContent = "⚠️ " + msg;
  errEl.style.display = "block";

}

// Flush every received character before replacing the typing cursor.
function finishTyping(){
  clearInterval(typingTimer); typingTimer = null;
  currentText += typingQueue.join(""); typingQueue = [];
  currentBubble.textContent = currentText;
}

/* ================= 草稿确认卡片（中断点 UI） =================
   后端在 create_reimbursement_draft 前强制中断，推 confirm 事件；
   用户点「确认」→ POST /chat/confirm(action=confirm) 继续执行；
   点「取消」→ action=reject，草稿不落库。 */
function renderConfirm(bubble, payload){
  const box = document.createElement("div");
  box.className = "confirm-card";
  const p = payload.preview || {};
  const heading = document.createElement("div");
  heading.className = "h"; heading.textContent = "📝 " + (p.title || "待确认操作");
  box.appendChild(heading);

  const tb = document.createElement("table");
  (p.fields || []).forEach(f => {
    const tr = document.createElement("tr");
    const td1 = document.createElement("td"); td1.textContent = f.label;
    const td2 = document.createElement("td"); td2.textContent = f.value;
    tr.appendChild(td1); tr.appendChild(td2); tb.appendChild(tr);
  });
  box.appendChild(tb);

  const note = document.createElement("div");
  note.className = "n"; note.textContent = p.notice || "";
  box.appendChild(note);

  const btns = document.createElement("div");
  btns.className = "btns";
  const yes = document.createElement("button");
  yes.className = "yes"; yes.textContent = "确认生成草稿";
  const no = document.createElement("button");
  no.className = "no"; no.textContent = "取消";
  btns.appendChild(yes); btns.appendChild(no);
  box.appendChild(btns);
  bubble.appendChild(box);
  scrollBottom();

  // 确认：恢复执行，把后续结果流式渲染到同一条消息里
  yes.onclick = async () => {
    if (busy) return;
    yes.disabled = no.disabled = true;
    box.classList.add("done");
    yes.textContent = "处理中…";
    await runConfirm(payload.token, "confirm", box);
  };
  // 取消：告知后端丢弃挂起动作
  no.onclick = async () => {
    if (busy) return;
    yes.disabled = no.disabled = true;
    box.classList.add("done");
    try {
    const response = await fetch("/chat/confirm", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({token: payload.token, action:"reject"})
    });
    const result = await response.json();
    if (!response.ok || result.code !== 0) throw new Error(result.message || "取消失败，请查看记录");
    box.querySelector(".h").textContent = "❌ 已取消，未生成报销草稿";
    box.querySelector(".btns").remove();
    } catch (error) {
      showError(error.message || "取消失败，请查看记录");
      box.querySelector(".h").textContent = "取消结果未确认，请查看记录";
      yes.disabled = true; no.disabled = false;
    }
  };
}

/* 调用 /chat/confirm 并解析 SSE 流（与 /chat 同一套解析逻辑） */
async function runConfirm(token, action, cardBox){
  await requestStream("/chat/confirm", {token, action}, cardBox);
}

function setBusy(v){
  busy = v;
  sendEl.disabled = v;
  inputEl.disabled = v;
  if (!v) statusEl.textContent = "";
}

/* ================= 核心：解析 SSE 流（fetch + ReadableStream） =================
   EventSource 只支持 GET，这里用 fetch POST 并手动解析 text/event-stream 格式 */
async function ask(question){
  await requestStream("/chat", {session_id: sessionId || null, question});
}

async function requestStream(url, body, cardBox){
  setBusy(true);
  errEl.style.display = "none";
  currentBubble = addMsg("bot"); currentText = "";
  cursorEl = document.createElement("span"); cursorEl.className = "cursor";
  currentBubble.appendChild(cursorEl);
  let sources = [], toolLog = [];
  try {
    const response = await fetch(url, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
    });
    await ClinicStream.consume(response, (event, payload) => {
      switch (event){
        case "meta":
          sessionId = payload.session_id;
          localStorage.setItem("clinic_session", sessionId);
          break;
        case "status": statusEl.textContent = payload.text; break;
        case "sources": sources = payload.sources || []; break;
        case "tool":
          toolLog.push({name:payload.name, ok:payload.result?.ok !== false,
                        message:payload.result?.message || ""});
          break;
        case "delta": enqueueTyping(payload.content || ""); break;
        case "confirm":
          finishTyping();
          renderTools(currentBubble, toolLog); toolLog = [];
          renderConfirm(currentBubble, payload);
          break;
        case "done":
          finishTyping();
          if (!currentText) currentBubble.textContent = "本次未生成回答，请重试";
          if (cardBox){
            cardBox.querySelector(".h").textContent = "已处理，结果请查看下方回复和执行过程";
            cardBox.querySelector(".btns")?.remove();
          }
          break;
        case "error":
          if (payload.code === 2001){
            sessionId = ""; localStorage.removeItem("clinic_session");
          }
          break;
      }
    });
  } catch (error){
    finishTyping();
    const message = error.message || "网络异常，请检查连接后重试";
    if (!currentText) currentBubble.textContent = message;
    showError(message);
    if (cardBox) cardBox.querySelector(".h").textContent = "处理结果未确认，请先查看记录，避免重复提交";
  } finally {
    renderTools(currentBubble, toolLog);
    if (sources.length) renderSources(currentBubble, sources);
    setBusy(false); scrollBottom(); inputEl.focus();
  }
}

/* ================= 发送 ================= */
function send(){
  const q = inputEl.value.trim();
  if (!q || busy) return;
  addMsg("user").textContent = q;       // 用户气泡直接显示
  inputEl.value = "";
  ask(q);
}
sendEl.onclick = send;
inputEl.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
});

/* ================= 刷新后恢复历史会话 ================= */
(async function restore(){
  if (!sessionId) return;
  const r = await fetch("/sessions/" + sessionId + "/messages").catch(() => null);
  if (!r || !r.ok){ localStorage.removeItem("clinic_session"); sessionId = ""; return; }
  const res = await r.json();
  if (res.code !== 0){ localStorage.removeItem("clinic_session"); sessionId = ""; return; }
  res.data.forEach(m => {
    const b = addMsg(m.role);
    b.textContent = m.content;
    if (m.sources) renderSources(b, m.sources);
  });
  if (!res.data.length) localStorage.removeItem("clinic_session");
})();
</script>
<script src="/message-view.js"></script>
</body>
</html>
